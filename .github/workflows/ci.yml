# CI BSL Compass Pro (dx4.5): линт + тесты ядра, сборка панели.
# Минимум: без секретов, без публикации — только проверка push/PR.
name: CI

on:
  push:
  pull_request:

# Минимальные права по умолчанию для всех джобов (docker-build расширяет
# своими jobs-level permissions)
permissions:
  contents: read

jobs:
  python:
    name: ruff + pytest (3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Пиннинг по SHA: исходный тег в комментарии
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Установка зависимостей (рантайм + dev)
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Линт (ruff, конфиг ruff.toml)
        run: ruff check src tests
      - name: Тесты
        run: pytest tests/ -q

  panel:
    name: сборка панели (node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - name: Установка зависимостей панели
        run: npm ci
      - name: Тесты панели (vitest)
        run: npm run test
      - name: Сборка панели
        run: npm run build

  docker-build:
    name: образ (собираемость; push в GHCR — latest на main, v* по тегам)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # push в ghcr.io (compass-p3d): GITHUB_TOKEN + packages:write;
    # на PR джоба остаётся проверкой собираемости (compass-he6) — без push
    permissions:
      contents: read
      packages: write
    # скоуп: PR + push в main + релизные теги v*
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Сборка образа (PR — только собираемость)
        if: github.event_name == 'pull_request'
        run: docker build --build-arg GIT_SHA=${{ github.sha }} .
      - name: Сборка и push в GHCR (main → latest; тег v* → версия образа)
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/bsl-compass-pro"
          TAG="${IMAGE}:latest"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${IMAGE}:${GITHUB_REF_NAME}"
          fi
          docker build --build-arg GIT_SHA="${GITHUB_SHA}" -t "${TAG}" .
          echo "${{ github.token }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          docker push "${TAG}"
